name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: List build outputs
        if: always()
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f 2>/dev/null || echo "No APKs found"
          echo ""
          echo "Directory structure of build outputs:"
          ls -la app/build/outputs/ 2>/dev/null || echo "app/build/outputs not found"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weblab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release:
    name: Build & Release Signed APK
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore keystore.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
